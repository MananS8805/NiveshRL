# Fixed stock universe: ~30 liquid NIFTY 50 constituents continuously listed
# since 2008. NOTE: this is today's index membership applied to the past, which
# introduces survivorship bias (see README "Limitations"). Every strategy uses
# the same universe, so comparisons *between* strategies stay fair.
# Swaps made for data quality (see scripts/prepare_data.py):
#   POWERGRID -> HEROMOTOCO  (POWERGRID listed Oct 2007, would cut 2008 from training)
#   NESTLEIND -> BRITANNIA   (yfinance NESTLEIND is a frozen price with zero volume until Jan 2010)
