[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niveshrl"
version = "0.1.0"
description = "Deep RL portfolio manager for Indian equities with India-realistic costs, taxes and investor-profile conditioning"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
